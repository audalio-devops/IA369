server:
  port: 8084

spring:
  application:
    name: client-service

  # Spring Security temporariamente desabilitado
  security:
    enabled: false

  datasource:
    # URL para conectar do Windows ao PostgreSQL no WSL2
    url: jdbc:postgresql://localhost:5432/client_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Desabilitar Eureka para desenvolvimento local
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bordero.client: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG