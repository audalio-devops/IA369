# =============================================================================
# Docker Compose com Docker Secrets (Docker Swarm)
# =============================================================================
# USO:
# 1. Iniciar Swarm: docker swarm init
# 2. Criar secrets: ./scripts/create-secrets.sh
# 3. Deploy: docker stack deploy -c docker-compose.secrets.yml ia369
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: nfe_db
    secrets:
      - postgres_user
      - postgres_password
    # ... resto da configuração

  nfe-processor-service:
    build:
      context: ./nfe-processor-service
    environment:
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - jwt_secret
    # ... resto da configuração

# ---------------------------------------------------------------------------
# SECRETS
# ---------------------------------------------------------------------------
secrets:
  postgres_user:
    external: true
  postgres_password:
    external: true
  db_password:
    external: true
  jwt_secret:
    external: true
  kafka_password:
    external: true