server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: nfe-processor
          uri: lb://nfe-processor-service
          predicates:
            - Path=/api/nfe/**
          filters:
            - StripPrefix=1
        - id: bordero-generator
          uri: lb://bordero-generator-service
          predicates:
            - Path=/api/bordero/**
          filters:
            - StripPrefix=1
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
