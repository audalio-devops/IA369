<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Notas Fiscais - Sistema Factoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.01);
        }

        .upload-area.dragover {
            border-color: #28a745;
            background: #e8f5e9;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin: 30px 0;
        }

        .file-list-header {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .file-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .file-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .file-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .file-details h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .file-details p {
            color: #666;
            font-size: 0.9em;
        }

        .file-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-right: 10px;
        }

        .status-pending {
            background: #ffc107;
            color: #333;
        }

        .status-success {
            background: #28a745;
            color: white;
        }

        .status-error {
            background: #dc3545;
            color: white;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .results {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-label {
            color: #666;
            font-size: 0.9em;
        }

        .success-color { color: #28a745; }
        .error-color { color: #dc3545; }
        .total-color { color: #667eea; }

        .result-item {
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .result-item.success { border-left-color: #28a745; }
        .result-item.error { border-left-color: #dc3545; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: bold;
            color: #333;
        }

        .result-details {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Upload de Notas Fiscais Eletrônicas</h1>
        <p class="subtitle">Sistema de Processamento em Lote de NFe-XML</p>

        <!-- Campo CNPJ do Cliente -->
        <div class="form-group">
            <label for="cnpjCliente">CNPJ do Cliente (Cedente) *</label>
            <input 
                type="text" 
                id="cnpjCliente" 
                placeholder="Digite o CNPJ (apenas números - 14 dígitos)"
                maxlength="14"
                pattern="[0-9]{14}"
            >
            <small style="color: #666; display: block; margin-top: 5px;">
                Exemplo: 12345678000195
            </small>
        </div>

        <!-- Área de Upload -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Clique aqui ou arraste os arquivos XML</div>
            <div class="upload-hint">Suporte para múltiplos arquivos simultaneamente</div>
            <input type="file" id="fileInput" multiple accept=".xml">
        </div>

        <!-- Lista de Arquivos -->
        <div id="fileListContainer" style="display: none;">
            <div class="file-list-header">
                📋 Arquivos Selecionados (<span id="fileCount">0</span>)
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <!-- Barra de Progresso -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>

        <!-- Botões de Ação -->
        <div class="action-buttons">
            <button class="btn btn-secondary" id="clearBtn" onclick="limparArquivos()">
                🗑️ Limpar Tudo
            </button>
            <button class="btn btn-primary" id="uploadBtn" onclick="processarArquivos()" disabled>
                ⬆️ Processar NFes
            </button>
        </div>

        <!-- Resultados -->
        <div class="results" id="results">
            <h2>📈 Resultados do Processamento</h2>
            <div class="summary" id="summary"></div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        let arquivosSelecionados = [];
        const API_BASE_URL = 'http://localhost:8081'; // Porta do nfe-processor-service

        // Elementos DOM
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileCount = document.getElementById('fileCount');
        const uploadBtn = document.getElementById('uploadBtn');
        const cnpjInput = document.getElementById('cnpjCliente');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const results = document.getElementById('results');

        // Click para selecionar arquivos
        uploadArea.addEventListener('click', () => fileInput.click());

        // Seleção de arquivos
        fileInput.addEventListener('change', (e) => {
            adicionarArquivos(Array.from(e.target.files));
            fileInput.value = '';
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            adicionarArquivos(Array.from(e.dataTransfer.files));
        });

        // Validar CNPJ enquanto digita
        cnpjInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            validarFormulario();
        });

        function adicionarArquivos(novosArquivos) {
            const xmls = novosArquivos.filter(f => f.name.toLowerCase().endsWith('.xml'));
            
            if (xmls.length === 0) {
                alert('⚠️ Por favor, selecione apenas arquivos XML');
                return;
            }

            if (novosArquivos.length > xmls.length) {
                alert(`⚠️ ${novosArquivos.length - xmls.length} arquivo(s) ignorado(s) (não são XML)`);
            }

            xmls.forEach(arquivo => {
                if (!arquivosSelecionados.find(a => a.name === arquivo.name)) {
                    arquivosSelecionados.push(arquivo);
                }
            });

            atualizarListaArquivos();
        }

        function atualizarListaArquivos() {
            fileList.innerHTML = '';
            
            if (arquivosSelecionados.length === 0) {
                fileListContainer.style.display = 'none';
                validarFormulario();
                return;
            }

            fileListContainer.style.display = 'block';
            fileCount.textContent = arquivosSelecionados.length;

            arquivosSelecionados.forEach((arquivo, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">📄</div>
                        <div class="file-details">
                            <h4>${arquivo.name}</h4>
                            <p>${formatarTamanho(arquivo.size)}</p>
                        </div>
                    </div>
                    <span class="file-status status-pending">Aguardando</span>
                    <button class="remove-btn" onclick="removerArquivo(${index})">✕</button>
                `;
                fileList.appendChild(item);
            });

            validarFormulario();
        }

        function validarFormulario() {
            const cnpj = cnpjInput.value.trim();
            const temArquivos = arquivosSelecionados.length > 0;
            const cnpjValido = cnpj.length === 14;

            uploadBtn.disabled = !(temArquivos && cnpjValido);
        }

        function removerArquivo(index) {
            arquivosSelecionados.splice(index, 1);
            atualizarListaArquivos();
        }

        function limparArquivos() {
            arquivosSelecionados = [];
            atualizarListaArquivos();
            results.classList.remove('show');
            progressBar.classList.remove('show');
        }

        async function processarArquivos() {
            const cnpj = cnpjInput.value.trim();
            
            if (!cnpj || cnpj.length !== 14) {
                alert('⚠️ Por favor, informe um CNPJ válido (14 dígitos)');
                return;
            }

            if (arquivosSelecionados.length === 0) {
                alert('⚠️ Selecione pelo menos um arquivo XML');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="loading">⏳</span> Processando...';
            progressBar.classList.add('show');
            results.classList.remove('show');

            const formData = new FormData();
            arquivosSelecionados.forEach(arquivo => {
                formData.append('arquivos', arquivo);
            });
            formData.append('cnpjCliente', cnpj);

            try {
                let progresso = 0;
                const intervalo = setInterval(() => {
                    if (progresso < 90) {
                        progresso += 10;
                        atualizarProgresso(progresso);
                    }
                }, 200);

                const response = await fetch(`${API_BASE_URL}/nfe/upload-lote`, {
                    method: 'POST',
                    body: formData
                });

                clearInterval(intervalo);
                atualizarProgresso(100);

                if (!response.ok) {
                    throw new Error('Erro ao processar arquivos: ' + response.statusText);
                }

                const resultado = await response.json();
                exibirResultados(resultado);

            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao processar arquivos: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '⬆️ Processar NFes';
                setTimeout(() => {
                    progressBar.classList.remove('show');
                }, 1000);
            }
        }

        function atualizarProgresso(valor) {
            progressFill.style.width = valor + '%';
            progressFill.textContent = valor + '%';
        }

        function exibirResultados(dados) {
            results.classList.add('show');

            document.getElementById('summary').innerHTML = `
                <div class="summary-card">
                    <div class="summary-value total-color">${dados.totalArquivos}</div>
                    <div class="summary-label">Total Processados</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value success-color">${dados.sucessos}</div>
                    <div class="summary-label">✅ Sucessos</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value error-color">${dados.erros}</div>
                    <div class="summary-label">❌ Erros</div>
                </div>
            `;

            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '<h3 style="margin-bottom: 15px;">📋 Detalhes por Arquivo</h3>';

            dados.resultados.forEach(item => {
                const div = document.createElement('div');
                div.className = `result-item ${item.sucesso ? 'success' : 'error'}`;
                
                let detalhes = '';
                if (item.sucesso) {
                    detalhes = `
                        <div class="result-details">
                            <strong>✅ Chave de Acesso:</strong> ${item.chaveAcesso || 'N/A'}<br>
                            <strong>📄 Número da Nota:</strong> ${item.numeroNota || 'N/A'}<br>
                            <strong>💰 Valor Total:</strong> R$ ${item.valorTotal ? item.valorTotal.toFixed(2) : '0.00'}<br>
                            <strong>📊 Duplicatas:</strong> ${item.quantidadeDuplicatas || 0}
                        </div>
                    `;
                } else {
                    const errosMsg = item.erros && item.erros.length > 0 
                        ? item.erros.join('<br>') 
                        : item.mensagem;
                    detalhes = `<div class="result-details" style="color: #dc3545;">❌ ${errosMsg}</div>`;
                }

                div.innerHTML = `
                    <div class="result-header">
                        <span class="result-title">${item.nomeArquivo}</span>
                        <span class="file-status ${item.sucesso ? 'status-success' : 'status-error'}">
                            ${item.sucesso ? '✅ SUCESSO' : '❌ ERRO'}
                        </span>
                    </div>
                    ${detalhes}
                `;
                
                resultsList.appendChild(div);
            });

            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function formatarTamanho(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }
    </script>
</body>
</html>
